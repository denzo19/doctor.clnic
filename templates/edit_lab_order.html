{% extends "base.html" %}

{% block content %}

<section class="visit-page">

    <div class="modal-content visit-content">

        <div class="modal-header">
            <h2>
                <i class="fas fa-vial"></i>
                Edit Lab Order
            </h2>

            <a href="{{ url_for('patient_details', patient_id=order.patient_id, doctor_id=doctor_id) }}"
               class="modal-close-btn">
                <i class="fas fa-times"></i>
            </a>
        </div>

        <form method="POST" class="modal-form visit-form">

            <div class="form-grid">

                <div class="form-group">
                    <label>Lab Test</label>
                    <select name="test_id" required>
                        {% for test in lab_tests %}
                            <option value="{{ test.id }}"
                                {% if test.id == order.test_id %}selected{% endif %}>
                                {{ test.test_name }} - {{ test.category }} - {{ test.unit }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label>Order Date</label>
                    <input type="date" name="result_date" value="{{ order.result_date }}" required>
                </div>

                <div class="form-group form-group-wide">
                    <label>Notes</label>
                    <textarea name="notes">{{ order.notes }}</textarea>
                </div>

            </div>

            <div class="modal-actions">
                <button type="submit"
                        name="save_type"
                        value="draft"
                        class="standard-btn form-save-btn">
                    <i class="fas fa-save"></i>
                    Save Draft
                </button>

                <button type="submit"
                        name="save_type"
                        value="final"
                        class="standard-btn primary-btn">
                    <i class="fas fa-lock"></i>
                    Final Order
                </button>

                <a href="{{ url_for('patient_details', patient_id=order.patient_id, doctor_id=doctor_id) }}"
                   class="standard-btn form-cancel-btn">
                    <i class="fas fa-ban"></i>
                    Cancel
                </a>
            </div>

        </form>

    </div>

</section>

{% endblock %}
