{% extends "base.html" %}

{% block content %}

<section class="visit-page">

    <div class="modal-content visit-content">

        <div class="modal-header">
            <h2>
                <i class="fas fa-pills"></i>
                Edit Prescription
            </h2>

            <a href="{{ url_for('patient_details', patient_id=prescription.patient_id, doctor_id=doctor_id) }}"
               class="modal-close-btn">
                <i class="fas fa-times"></i>
            </a>
        </div>

        <form method="POST" class="modal-form visit-form">

            <div class="form-grid">

                <div class="form-group">
                    <label>Medication</label>
                    <select name="medication_id" required>
                        {% for med in medications %}
                            <option value="{{ med.id }}"
                                {% if med.id == prescription.medication_id %}selected{% endif %}>
                                {{ med.medication_name }} - {{ med.strength }} - {{ med.dosage_form }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label>Dose</label>
                    <input type="text" name="dose" value="{{ prescription.dose }}" required>
                </div>

                <div class="form-group">
                    <label>Frequency</label>
                    <input type="text" name="frequency" value="{{ prescription.frequency }}" required>
                </div>

                <div class="form-group">
                    <label>Start Date</label>
                    <input type="date" name="start_date" value="{{ prescription.start_date }}" required>
                </div>

                <div class="form-group form-group-wide">
                    <label>Notes</label>
                    <textarea name="notes">{{ prescription.notes }}</textarea>
                </div>

            </div>

            <div class="modal-actions">

                <button type="submit"
                        name="save_type"
                        value="draft"
                        class="standard-btn form-save-btn">
                    <i class="fas fa-save"></i>
                    Save Draft
                </button>

                <button type="submit"
                        name="save_type"
                        value="final"
                        class="standard-btn primary-btn">
                    <i class="fas fa-lock"></i>
                    Final Save
                </button>

                <a href="{{ url_for('patient_details', patient_id=prescription.patient_id, doctor_id=doctor_id) }}"
                   class="standard-btn form-cancel-btn">
                    <i class="fas fa-ban"></i>
                    Cancel
                </a>

            </div>

        </form>

    </div>

</section>

{% endblock %}
