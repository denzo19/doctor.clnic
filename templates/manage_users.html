{% extends "base.html" %}

{% block content %}

<section class="app-page">

    <div class="page-header">
        <h1>
            <i class="fas fa-users"></i>
            Manage Users
        </h1>
    </div>
    <div class="details-card">
        <form method="POST" class="toolbar-form">

            <input type="text"
                   name="username"
                   class="toolbar-search-input"
                   placeholder="Username"
                   required>

            <input type="email"
                   name="email"
                   class="toolbar-search-input"
                   placeholder="Email">

            <input type="text"
                   name="full_name"
                   class="toolbar-search-input"
                   placeholder="Full name"
                   required>

            <input type="text"
                   name="password_hash"
                   class="toolbar-search-input"
                   placeholder="Password hash"
                   required>

            <select name="group_id"
                    class="toolbar-search-input"
                    required>
                <option value="">Group</option>
                {% for group in groups %}
                    <option value="{{ group.id }}">
                        {{ group.group_name }}
                    </option>
                {% endfor %}
            </select>

            <button type="submit"
                    class="toolbar-btn add-btn"
                    title="Add User">
                <i class="fas fa-plus"></i>
            </button>

        </form>
    </div>

    <div class="table-container">
        <table class="app-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Username</th>
                    <th>Email</th>
                    <th>Full Name</th>
                    <th>Group</th>
                    <th>Active</th>
                    <th class="actions-header">Actions</th>
                </tr>
            </thead>

            <tbody>
                {% for user in users %}
                <tr>
                    <form method="POST"
                          action="{{ url_for('update_user', user_id=user.id) }}">

                        <td>{{ user.id }}</td>

                        <td>
                            <input type="text"
                                   name="username"
                                   value="{{ user.username }}"
                                   class="table-input"
                                   required>
                        </td>

                        <td>
                            <input type="email"
                                   name="email"
                                   value="{{ user.email or '' }}"
                                   class="table-input">
                        </td>

                        <td>
                            <input type="text"
                                   name="full_name"
                                   value="{{ user.full_name }}"
                                   class="table-input"
                                   required>
                        </td>

                        <td>
                            <select name="group_id" class="table-input" required>
                                {% for group in groups %}
                                    <option value="{{ group.id }}"
                                        {% if group.id == user.group_id %}selected{% endif %}>
                                        {{ group.group_name }}
                                    </option>
                                {% endfor %}
                            </select>
                        </td>

                        <td>
                            <select name="is_active" class="table-input">
                                <option value="1" {% if user.is_active %}selected{% endif %}>Yes</option>
                                <option value="0" {% if not user.is_active %}selected{% endif %}>No</option>
                            </select>
                        </td>

                        <td class="action-cell">
                            <button type="submit"
                                    class="table-action edit-action"
                                    title="Update">
                                <i class="fas fa-save"></i>
                            </button>
                    </form>

                            {% if user.is_active %}
                                <form method="POST"
                                      action="{{ url_for('stop_user', user_id=user.id) }}"
                                      class="inline-delete-form"
                                      onsubmit="return confirm('Stop this user?');">
                                    <button type="submit"
                                            class="table-action delete-action"
                                            title="Stop User">
                                        <i class="fas fa-ban"></i>
                                    </button>
                                </form>
                            {% else %}
                                <span class="locked-label" title="Inactive user">
                                    <i class="fas fa-lock"></i>
                                </span>
                            {% endif %}
                        </td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="7" class="empty-row">
                        No users found.
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

</section>

{% endblock %}
