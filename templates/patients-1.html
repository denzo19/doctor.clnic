{% extends "base.html" %}

{% block content %}

<section class="app-page">

    <div class="page-header">
        <h1>
            <i class="fas fa-hospital-user"></i>
            Patients
        </h1>
    </div>
    <div class="details-card">

        <form method="GET" class="toolbar-form">
            <input type="text"
                   name="search"
                   value="{{ search or '' }}"
                   class="toolbar-search-input"
                   placeholder="Search patient">

            <button type="submit"
                    class="toolbar-btn search-btn"
                    title="Search">
                <i class="fas fa-search"></i>
            </button>

            <a href="{{ url_for('patients') }}"
               class="toolbar-btn clear-btn"
               title="Clear">
                <i class="fas fa-times"></i>
            </a>
        </form>

        <form method="POST" class="toolbar-form" style="margin-top:10px;">

            <input type="text"
                   name="patient_code"
                   class="toolbar-search-input"
                   placeholder="Code"
                   required>

            <input type="text"
                   name="first_name"
                   class="toolbar-search-input"
                   placeholder="First name"
                   required>

            <input type="text"
                   name="middle_name"
                   class="toolbar-search-input"
                   placeholder="Middle name">

            <input type="text"
                   name="last_name"
                   class="toolbar-search-input"
                   placeholder="Last name"
                   required>

            <input type="date"
                   name="date_of_birth"
                   class="toolbar-search-input">

            <select name="gender"
                    class="toolbar-search-input">
                <option value="">Gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
            </select>

            <input type="text"
                   name="phone_number"
                   class="toolbar-search-input"
                   placeholder="Phone">

            <input type="email"
                   name="email"
                   class="toolbar-search-input"
                   placeholder="Email">

            <input type="text"
                   name="address"
                   class="toolbar-search-input"
                   placeholder="Address">

            <button type="submit"
                    class="toolbar-btn add-btn"
                    title="Add Patient">
                <i class="fas fa-plus"></i>
            </button>

        </form>

    </div>

    <div class="table-container">
        <table class="app-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Code</th>
                    <th>First</th>
                    <th>Middle</th>
                    <th>Last</th>
                    <th>DOB</th>
                    <th>Gender</th>
                    <th>Phone</th>
                    <th>Email</th>
                    <th>Address</th>
                    <th>Active</th>
                    <th class="actions-header">Actions</th>
                </tr>
            </thead>

            <tbody>
                {% for patient in patients %}
                <tr>
                    <form method="POST"
                          action="{{ url_for('update_patient', patient_id=patient.id) }}">

                        <td>{{ patient.id }}</td>

                        <td>
                            <input type="text"
                                   name="patient_code"
                                   value="{{ patient.patient_code }}"
                                   class="table-input"
                                   required>
                        </td>

                        <td>
                            <input type="text"
                                   name="first_name"
                                   value="{{ patient.first_name }}"
                                   class="table-input"
                                   required>
                        </td>

                        <td>
                            <input type="text"
                                   name="middle_name"
                                   value="{{ patient.middle_name or '' }}"
                                   class="table-input">
                        </td>

                        <td>
                            <input type="text"
                                   name="last_name"
                                   value="{{ patient.last_name }}"
                                   class="table-input"
                                   required>
                        </td>

                        <td>
                            <input type="date"
                                   name="date_of_birth"
                                   value="{{ patient.date_of_birth or '' }}"
                                   class="table-input">
                        </td>

                        <td>
                            <select name="gender" class="table-input">
                                <option value="">Gender</option>
                                <option value="Male" {% if patient.gender == 'Male' %}selected{% endif %}>Male</option>
                                <option value="Female" {% if patient.gender == 'Female' %}selected{% endif %}>Female</option>
                                <option value="Other" {% if patient.gender == 'Other' %}selected{% endif %}>Other</option>
                            </select>
                        </td>

                        <td>
                            <input type="text"
                                   name="phone_number"
                                   value="{{ patient.phone_number or '' }}"
                                   class="table-input">
                        </td>

                        <td>
                            <input type="email"
                                   name="email"
                                   value="{{ patient.email or '' }}"
                                   class="table-input">
                        </td>

                        <td>
                            <input type="text"
                                   name="address"
                                   value="{{ patient.address or '' }}"
                                   class="table-input">
                        </td>

                        <td>
                            <select name="is_active" class="table-input">
                                <option value="1" {% if patient.is_active %}selected{% endif %}>Yes</option>
                                <option value="0" {% if not patient.is_active %}selected{% endif %}>No</option>
                            </select>
                        </td>

                        <td class="action-cell">
                            <button type="submit"
                                    class="table-action edit-action"
                                    title="Update">
                                <i class="fas fa-save"></i>
                            </button>
                    </form>

                            {% if patient.is_active %}
                                <form method="POST"
                                      action="{{ url_for('stop_patient', patient_id=patient.id) }}"
                                      class="inline-delete-form"
                                      onsubmit="return confirm('Stop this patient?');">

                                    <button type="submit"
                                            class="table-action delete-action"
                                            title="Stop Patient">
                                        <i class="fas fa-ban"></i>
                                    </button>

                                </form>
                            {% else %}
                                <span class="locked-label" title="Inactive patient">
                                    <i class="fas fa-lock"></i>
                                </span>
                            {% endif %}
                        </td>

                </tr>
                {% else %}
                <tr>
                    <td colspan="12" class="empty-row">
                        No patients found.
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

</section>

{% endblock %}
